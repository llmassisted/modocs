name: Build APK

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source GitHub Actions cache rather than the default commercial caching service.
          cache-provider: basic

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$version" || { echo "::error::No versionName found in app/build.gradle.kts"; exit 1; }
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # The in-app updater compares the latest release tag with the installed versionName.
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION in app/build.gradle.kts. Tag the release v$VERSION."
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        if: github.event_name == 'pull_request' || github.ref_type != 'tag'
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request' || github.ref_type != 'tag'
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error

      - name: Build unsigned release APK
        if: github.ref_type == 'tag'
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          archive: false
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release-unsigned.apk

      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.MODOCS_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MODOCS_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MODOCS_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MODOCS_RELEASE_KEY_PASSWORD }}
          TAG: ${{ github.ref_name }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.jks"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "modocs-$TAG.apk" app-release-unsigned.apk
          "$apksigner" verify --print-certs "modocs-$TAG.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: modocs-${{ github.ref_name }}.apk
          archive: false
          if-no-files-found: error

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "modocs-$TAG.apk" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
